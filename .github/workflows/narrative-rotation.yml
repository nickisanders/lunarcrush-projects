name: narrative-rotation weekly

on:
  schedule:
    - cron: "0 14 * * 0"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: projects/narrative-rotation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/narrative-rotation/package-lock.json
      - run: npm ci
      # Typecheck and tests gate the run. A ReferenceError from an
      # unimported constant failed this job silently for 18 days.
      - run: npm run typecheck
      - run: npm test
      - name: Run weekly report
        env:
          LUNARCRUSH_API_KEY: ${{ secrets.LUNARCRUSH_API_KEY }}
          POST_PROMO_CODE: ${{ vars.POST_PROMO_CODE }}
        run: npm run weekly
      - name: Upload output
        uses: actions/upload-artifact@v7
        with:
          name: narrative-rotation-output
          path: projects/narrative-rotation/out/
          retention-days: 30
