name: altrank-movers daily

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: projects/altrank-movers
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/altrank-movers/package-lock.json
      - run: npm ci
      # Typecheck and tests gate the run. A ReferenceError from an
      # unimported constant failed this job silently for 18 days.
      - run: npm run typecheck
      - run: npm test
      - name: Run bot
        env:
          LUNARCRUSH_API_KEY: ${{ secrets.LUNARCRUSH_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_LINK_URL: ${{ vars.POST_LINK_URL }}
          POST_PROMO_CODE: ${{ vars.POST_PROMO_CODE }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            npm run daily -- --send
          else
            npm run daily
          fi
      - name: Upload output
        uses: actions/upload-artifact@v7
        with:
          name: altrank-movers-output
          path: projects/altrank-movers/out/
          retention-days: 14
